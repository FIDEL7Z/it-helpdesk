# Local MongoDB for development and evaluation.
# The backend and the frontend run with npm (see README).
#
# Note: MongoDB runs WITHOUT authentication here. The port is published only on
# 127.0.0.1, so it is reachable from this machine but not from the network.
# Do not use this configuration in production.
name: it-helpdesk

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Local inbox for the e-mail notifications (EMAIL_PROVIDER=mailpit): every message stays here,
  # whatever the address. Web inbox and send API on http://localhost:8025 (this machine only).
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025'
    environment:
      # Keep only the latest messages; the inbox is for reading, not an archive.
      MP_MAX_MESSAGES: '500'

volumes:
  # Named volume: data survives `docker compose down` (removed only with `down -v`).
  mongo-data:

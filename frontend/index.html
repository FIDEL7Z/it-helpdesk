<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT Helpdesk</title>
    <script>
      // Light is the default; apply a saved dark choice before the first paint.
      try { if (localStorage.getItem('it-helpdesk:theme') === 'dark') document.documentElement.dataset.theme = 'dark' } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
